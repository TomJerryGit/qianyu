name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: |
          python -m coverage run --source=src/qianyu -m unittest discover -s tests/unit -v
      - name: UI smoke coverage
        run: |
          python -m coverage run --append --source=src/qianyu spike/ui_smoke.py
          python -m coverage combine
          python -m coverage report --skip-covered --fail-under=40
          python -m coverage xml -o coverage.xml
      - name: Smoke import
        run: python -c "import qianyu; print(qianyu.__version__)"
      - name: Performance gate
        run: python tools/perf_gate.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
