name: selfhosted-smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, windows, qianyu]
    steps:
      - uses: actions/checkout@v4

      - name: Runner environment
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          $python = "D:\qianyu\tools\venv311\Scripts\python.exe"
          if (Test-Path $python) {
            & $python --version
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            Write-Host "Python not found on runner PATH"
          }
          Write-Host "SELFHOSTED_SMOKE_OK"
