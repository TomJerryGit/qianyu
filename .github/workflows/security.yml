name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install pip-audit bandit cyclonedx-bom pip-licenses
      - name: Secret scan (blocking)
        run: python tools/scan_secrets.py
      - name: Dependency audit (report only)
        continue-on-error: true
        run: |
          python -m pip_audit --format json --output pip-audit.json
          python -m pip_audit --format columns
      - name: Bandit (report only)
        continue-on-error: true
        run: python -m bandit -r src -ll -f json -o bandit.json
      - name: Licenses
        continue-on-error: true
        run: python -m piplicenses --format=markdown --with-urls > licenses.md
      - name: SBOM
        run: python -m cyclonedx_py environment --output-file sbom.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit.json
            bandit.json
            licenses.md
            sbom.json
          if-no-files-found: warn
